name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned so a new Flutter release can't change the app unexpectedly;
          # bump it on purpose. The SDK is cached between runs.
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --base-href /wattly/
      - name: Remove files the web app never downloads
        run: |
          # CanvasKit is loaded from Google's CDN (the build config names an
          # engine revision), so the local copies (about 35 MB) are never used
          # and only slow the deploy down. Stop here if that ever changes.
          grep -q '"engineRevision"' build/web/flutter_bootstrap.js
          rm -rf build/web/canvaskit
          find build/web -name '*.symbols' -delete
          du -sh build/web
      - name: Make phones pick up each new version
        run: |
          # GitHub Pages lets browsers reuse files for 10 minutes, and an
          # installed home-screen app can hold on to old ones much longer. Name
          # the app's files after this commit so a new deploy is never mistaken
          # for the old one.
          v="${GITHUB_SHA::8}"
          sed -i "s#src=\"flutter_bootstrap.js\"#src=\"flutter_bootstrap.js?v=$v\"#; s#href=\"main.dart.js\"#href=\"main.dart.js?v=$v\"#; s#src=\"ocr.js\"#src=\"ocr.js?v=$v\"#" build/web/index.html
          sed -i "s#\"main.dart.js\"#\"main.dart.js?v=$v\"#g" build/web/flutter_bootstrap.js
          grep -c "v=$v" build/web/index.html build/web/flutter_bootstrap.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
