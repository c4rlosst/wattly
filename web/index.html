<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Track your dorm's electricity use in kWh and cost.">
  <!-- No viewport-fit=cover: Flutter on the web can't read the iPhone's safe
       areas, so full-bleed would put the tab bar under the home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5A623">
  <script>
    // iPhones report a pixel ratio of 3, so every frame is drawn at about 2.25x
    // the pixels of a 2x screen. That is the main cost on a phone. Draw at 2x
    // instead; the browser scales it to fit (slightly softer, much smoother).
    // Must run before Flutter starts.
    (function () {
      if (window.devicePixelRatio > 2) {
        try {
          Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } });
        } catch (e) {}
      }
    })();
  </script>

  <!-- Open the connections the app is about to need (CanvasKit and the font
       come from Google's CDN) and start downloading the app's code now,
       instead of after the loader script has run. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wattly">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Wattly</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen shown until Flutter draws its first frame. */
    /* overscroll-behavior: no pull-to-refresh on Android, no rubber-band on
       iPhone that would reveal the page behind the app. */
    html, body {
      margin: 0; height: 100%; background: #F2F2F7;
      overscroll-behavior: none;
    }
    html.dark, html.dark body { background: #000; }
    #splash {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #splash svg { width: 96px; height: 96px; }
  </style>
  <script>
    // The app is light by default. Only use the dark loading screen when the
    // saved Appearance is Dark, or Auto on a device that is set to dark.
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('flutter.wattly_v1'));
        if (typeof saved === 'string') saved = JSON.parse(saved);
        var mode = saved && saved.appearance;
        if (mode === 'dark' ||
            (mode === 'system' &&
             window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.className = 'dark';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
      <defs>
        <linearGradient id="splash-amber" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFB63D"/>
          <stop offset="1" stop-color="#FF9500"/>
        </linearGradient>
      </defs>
      <rect width="256" height="256" rx="58" fill="url(#splash-amber)"/>
      <circle cx="128" cy="132" r="84" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="16"/>
      <circle cx="128" cy="132" r="84" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="396 528" transform="rotate(-90 128 132)"/>
      <path d="M88 112 L110 164 L128 130 L146 164 L168 112" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
